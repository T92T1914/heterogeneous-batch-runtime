[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "hbr-image-classifier"
version = "0.1.0"
description = "Optional bounded ONNX image classification consumer"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "Pillow==12.3.0", "onnx==1.23.1", "adaptive-timing-engine @ git+https://github.com/T92T1914/adaptive-timing-engine.git@b7cd3b716c588cf422320367c26ef3c6841ce5cb"]

[project.optional-dependencies]
cpu = ["onnxruntime==1.30.0"]
test = ["pytest==8.4.2"]

[project.scripts]
hbr-classify = "hbr_image_classifier.cli:main"

[tool.scikit-build]
wheel.packages = ["python/hbr_image_classifier"]
wheel.license-files = ["LICENSE"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and exercise backend discovery
        run: |
          cmake --install build --config Release --prefix installed
          python tests/package_components.py --prefix installed
      - name: Build Linux wheel
        if: runner.os != 'Windows'
        run: python -m pip install . pytest
      - name: Build Windows wheel
        if: runner.os == 'Windows'
        run: |
          $line = Get-Content build/CMakeCache.txt | Where-Object { $_.StartsWith('CMAKE_GENERATOR:INTERNAL=') }
          if (-not $line) { throw 'Native configure did not record its generator' }
          $env:CMAKE_GENERATOR = $line.Substring('CMAKE_GENERATOR:INTERNAL='.Length)
          python -m pip install . pytest
      - run: python tools/validate_evidence.py
      - run: python tools/report_reuse.py --check
      - run: python -m pytest tests/python -q
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DHBR_SANITIZERS=ON
      - run: cmake --build build/sanitize --parallel 2
      - run: ctest --test-dir build/sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
      - name: Explicit Clang host build
        run: cmake -S . -B build/clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build/clang --parallel 2
      - run: ctest --test-dir build/clang --output-on-failure
      - name: Separate host ThreadSanitizer configuration
        run: cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DHBR_THREAD_SANITIZER=ON
      - run: cmake --build build/tsan --parallel 2
      - name: Report host ThreadSanitizer outcome separately
        run: python tools/run_host_tsan.py build/tsan/hbr_tests --output reports/host-tsan.json
      - name: Retain actual host diagnostic state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tsan-state
          path: reports/host-tsan.json
